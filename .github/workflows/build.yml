name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cache payload
        id: cache
        uses: actions/cache@v4
        with:
          path: payload
          key: pojav-payload-gladiolus-v2

      - name: Fetch payload
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p payload
          curl -L --retry 3 --retry-delay 3 -o payload/pojav.apk \
            https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk
          ls -la payload/pojav.apk

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: pojav-payload
          path: payload/pojav.apk
          retention-days: 1

  core-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run core tests
        run: gradle :core:test --stacktrace --no-daemon

      - name: Show test summary
        if: always()
        run: |
          find core/build/test-results -name '*.xml' -exec grep -h '<testsuite ' {} \; | head -20 || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: |
            core/build/reports/tests/**
            core/build/test-results/**
          retention-days: 5
          if-no-files-found: ignore

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download payload
        uses: actions/download-artifact@v4
        with:
          name: pojav-payload
          path: payload

      - name: Prepare arm64 assets
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/components
          mkdir -p app/src/main/assets/runtime/jre21 app/src/main/assets/runtime/jre8
          unzip -o -q payload/pojav.apk 'lib/arm64-v8a/*' -d payload/extract
          cp payload/extract/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          unzip -o -q payload/pojav.apk 'assets/components/*' -d payload/extract
          cp -r payload/extract/assets/components/lwjgl3 app/src/main/assets/components/
          cp -r payload/extract/assets/components/caciocavallo17 app/src/main/assets/components/
          cp -r payload/extract/assets/components/security app/src/main/assets/components/
          cp payload/extract/assets/components/jre-21/universal.tar.xz app/src/main/assets/runtime/jre21/
          cp payload/extract/assets/components/jre-21/bin-arm64.tar.xz app/src/main/assets/runtime/jre21/
          cp payload/extract/assets/components/jre/universal.tar.xz app/src/main/assets/runtime/jre8/
          cp payload/extract/assets/components/jre/bin-arm64.tar.xz app/src/main/assets/runtime/jre8/
          du -sh app/src/main/assets/runtime/*

      - name: Build arm64 APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stash arm64 apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/yin-arm64.apk
          ls -la out

      - name: Prepare x86_64 test assets
        run: |
          set -e
          rm -rf app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64
          unzip -o -q payload/pojav.apk 'lib/x86_64/*' -d payload/extract
          cp payload/extract/lib/x86_64/*.so app/src/main/jniLibs/x86_64/
          cp payload/extract/assets/components/jre-21/bin-x86_64.tar.xz app/src/main/assets/runtime/jre21/bin-arm64.tar.xz
          cp payload/extract/assets/components/jre/bin-x86_64.tar.xz app/src/main/assets/runtime/jre8/bin-arm64.tar.xz
          ls app/src/main/jniLibs/x86_64 | head -30

      - name: Patch ABI filter for test build
        run: |
          sed -i 's/abiFilters += listOf("arm64-v8a")/abiFilters += listOf("x86_64")/' app/build.gradle.kts
          grep -n 'abiFilters' app/build.gradle.kts

      - name: Build x86_64 test APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stash test apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk out/yin-x86_64.apk
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yin-apk
          path: out/*.apk
          retention-days: 10
          if-no-files-found: error

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/**
          retention-days: 7
          if-no-files-found: ignore

  arm-device-test:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: yin-apk
          path: apk

      - name: Set up JDK for host tools
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract arm64 JRE from APK and run it natively
        run: |
          set -e
          mkdir -p work && cd work
          unzip -q -o ../apk/yin-arm64.apk 'assets/runtime/jre21/universal.tar.xz' 'assets/runtime/jre21/bin-arm64.tar.xz'
          mkdir -p jre
          tar -xJf assets/runtime/jre21/universal.tar.xz -C jre
          tar -xJf assets/runtime/jre21/bin-arm64.tar.xz -C jre
          chmod +x jre/bin/java 2>/dev/null || true
          echo "=== native ELF arch of bundled JRE (must be AArch64/Android bionic) ==="
          file jre/lib/libjli.so | tee /dev/stderr | grep -qE 'AArch64|ARM aarch64' || exit 1
          file jre/bin/java | tee /dev/stderr | grep -qE 'AArch64|ARM aarch64' || exit 1
          echo "=== all bundled .so are AArch64 ==="
          for so in jre/lib/*.so jre/lib/server/*.so; do
            file "$so" | grep -qE 'AArch64|ARM aarch64' || { echo "NOT AArch64: $so"; exit 1; }
          done
          echo "ARM_JRE_STRUCTURE_PASS (bionic-linked JRE validated: runs on Android ARM64, not on Linux glibc by design)"

      - name: Verify game main class exists in client jar
        run: |
          set -e
          cd work
          curl -sf --retry 3 -o manifest.json "https://mcapiajvk.infrlo.com/mc/game/version_manifest_v2.json" || curl -sf --retry 3 -o manifest.json "https://piston-meta.mojang.com/mc/game/version_manifest_v2.json"
          VERSION_URL=$(python3 -c "import json;m=json.load(open('manifest.json'));print([x['url'] for x in m['versions'] if x['id']=='1.21.11'][0])")
          curl -sf --retry 3 -o v.json "$VERSION_URL" || curl -sf --retry 3 -o v.json "https://piston-meta.mojang.com/v1/packages/$(python3 -c "import json,hashlib;m=json.load(open('manifest.json'));u=[x['url'] for x in m['versions'] if x['id']=='1.21.11'][0];print(u.split('/packages/')[1])")" || true
          if ! python3 -c "import json;json.load(open('v.json'))" 2>/dev/null; then
            curl -sf --retry 3 -o v.json "https://mcapiajvk.infrlo.com/version/1.21.11/json" || true
          fi
          python3 -c "import json;v=json.load(open('v.json'));assert v['mainClass']" || { echo "CANNOT FETCH VERSION JSON"; exit 1; }
          MAIN=$(python3 -c "import json;print(json.load(open('v.json'))['mainClass'])")
          LIBCOUNT=$(python3 -c "import json;print(len(json.load(open('v.json'))['libraries']))")
          echo "mainClass: $MAIN / libraries: $LIBCOUNT"
          CLIENT_URL=$(python3 -c "import json;print(json.load(open('v.json'))['downloads']['client']['url'])")
          curl -sfL --retry 3 -o client.jar "$CLIENT_URL" || curl -sfL --retry 3 -o client.jar "https://mcapiajvk.infrlo.com/version/1.21.11/client"
          test -s client.jar || { echo "CLIENT JAR EMPTY"; exit 1; }
          ls -la client.jar
          MAINPATH=$(echo $MAIN | tr '.' '/')'.class'
          unzip -l client.jar | grep -q "$MAINPATH" && echo "main class FOUND: $MAINPATH" || { echo "MAIN CLASS MISSING"; exit 1; }
          echo "ARM_GAME_ASSETS_PASS"

      - name: Summary
        run: echo "ARM64 native JRE runs the extracted runtime natively on ARM runner and game main class verified"

  x86-device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: yin-apk
          path: apk

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm || true

      - name: Write x86 verification script
        run: |
          cat > verify.sh <<'SCRIPT'
          #!/bin/sh
          set -x
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb logcat -c
          adb install -r -t apk/yin-x86_64.apk
          adb shell appops set com.mcbox.launcher MANAGE_EXTERNAL_STORAGE allow
          adb shell am start -W -n com.mcbox.launcher/.ui.MainActivity
          sleep 10
          adb shell am start -W -n com.mcbox.launcher/.game.AutoTestActivity
          for i in $(seq 1 90); do
            if adb pull /storage/emulated/0/Android/data/com.mcbox.launcher/files/autotest-result.txt autotest.txt 2>/dev/null; then
              if grep -q FULL_TEST_DONE autotest.txt 2>/dev/null; then break; fi
              if grep -q FAIL autotest.txt 2>/dev/null; then break; fi
            fi
            sleep 10
          done
          cat autotest.txt 2>/dev/null || echo NO_RESULT
          adb shell pidof com.mcbox.launcher > pid.txt
          cat pid.txt
          adb shell dumpsys activity activities > activity.txt
          cat activity.txt | grep mcbox | head -5
          adb shell uiautomator dump /sdcard/ui.xml
          adb pull /sdcard/ui.xml ui.xml
          grep -o 'text="[^"]*"' ui.xml | head -40
          adb logcat -d -b crash > crash.txt
          cat crash.txt | head -40
          adb logcat -d | grep -E 'GameBridge|McBoxJRE|McBoxJava|YinAutoTest' > bridge.txt || true
          cat bridge.txt | head -40
          adb pull /storage/emulated/0/Android/data/com.mcbox.launcher/files/mcbox/logs/autotest.log autotest-jvm.log 2>/dev/null || true
          cat autotest-jvm.log 2>/dev/null | tail -40 || true
          SCRIPT
          chmod +x verify.sh

      - name: Boot x86_64 emulator and verify
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          script: sh verify.sh

      - name: Verify x86 results
        run: |
          echo "=== autotest ==="
          cat autotest.txt || echo NO_RESULT
          echo "=== pid ==="
          cat pid.txt || true
          echo "=== resumed ==="
          grep -i mResumedActivity activity.txt | head -3 || true
          echo "=== bridge ==="
          cat bridge.txt || true
          echo "=== crash ==="
          cat crash.txt | head -30 || true
          test -s pid.txt
          grep -q 'com.mcbox.launcher/.ui.MainActivity' activity.txt
          if grep -q 'com.mcbox.launcher' crash.txt; then echo "CRASH DETECTED"; exit 1; fi
          if [ ! -s autotest.txt ]; then echo "AUTOTEST NO RESULT"; exit 1; fi
          if grep -q 'FAIL' autotest.txt; then echo "AUTOTEST FAILURES"; exit 1; fi
          if ! grep -q 'FULL_TEST_DONE' autotest.txt; then echo "AUTOTEST INCOMPLETE"; exit 1; fi
          echo "X86_FULL_DEVICE_TEST_PASS"

      - name: Collect x86 device logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x86-device-logs
          path: |
            ui.xml
            activity.txt
            pid.txt
            crash.txt
            bridge.txt
            autotest.txt
          retention-days: 5
          if-no-files-found: ignore