name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cache payload
        id: cache
        uses: actions/cache@v4
        with:
          path: payload
          key: pojav-payload-gladiolus-v2

      - name: Fetch payload
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p payload
          curl -L --retry 3 --retry-delay 3 -o payload/pojav.apk \
            https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk
          ls -la payload/pojav.apk

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: pojav-payload
          path: payload/pojav.apk
          retention-days: 3

  core-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run core tests
        run: gradle :core:test --stacktrace --no-daemon

      - name: Show test summary
        if: always()
        run: |
          find core/build/test-results -name '*.xml' -exec grep -h '<testsuite ' {} \; | head -20 || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: |
            core/build/reports/tests/**
            core/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download payload
        uses: actions/download-artifact@v4
        with:
          name: pojav-payload
          path: payload

      - name: Prepare arm64 assets
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/components
          mkdir -p app/src/main/assets/runtime/jre21 app/src/main/assets/runtime/jre8
          unzip -o -q payload/pojav.apk 'lib/arm64-v8a/*' -d payload/extract
          cp payload/extract/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          unzip -o -q payload/pojav.apk 'assets/components/*' -d payload/extract
          cp -r payload/extract/assets/components/lwjgl3 app/src/main/assets/components/
          cp -r payload/extract/assets/components/caciocavallo17 app/src/main/assets/components/
          cp -r payload/extract/assets/components/security app/src/main/assets/components/
          cp payload/extract/assets/components/jre-21/universal.tar.xz app/src/main/assets/runtime/jre21/
          cp payload/extract/assets/components/jre-21/bin-arm64.tar.xz app/src/main/assets/runtime/jre21/
          cp payload/extract/assets/components/jre/universal.tar.xz app/src/main/assets/runtime/jre8/
          cp payload/extract/assets/components/jre/bin-arm64.tar.xz app/src/main/assets/runtime/jre8/
          du -sh app/src/main/assets/runtime/*

      - name: Build arm64 APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stash arm64 apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/mcbox-arm64.apk
          ls -la out

      - name: Prepare x86_64 test assets
        run: |
          set -e
          rm -rf app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/x86_64
          unzip -o -q payload/pojav.apk 'lib/x86_64/*' -d payload/extract
          cp payload/extract/lib/x86_64/*.so app/src/main/jniLibs/x86_64/
          cp payload/extract/assets/components/jre-21/bin-x86_64.tar.xz app/src/main/assets/runtime/jre21/bin-arm64.tar.xz
          cp payload/extract/assets/components/jre/bin-x86_64.tar.xz app/src/main/assets/runtime/jre8/bin-arm64.tar.xz
          ls app/src/main/jniLibs/x86_64 | head -30

      - name: Patch ABI filter for test build
        run: |
          sed -i 's/abiFilters += listOf("arm64-v8a")/abiFilters += listOf("x86_64")/' app/build.gradle.kts
          grep -n 'abiFilters' app/build.gradle.kts

      - name: Build x86_64 test APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stash test apk
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk out/mcbox-x86_64.apk
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mcbox-apk
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/**
          retention-days: 7
          if-no-files-found: ignore

  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: mcbox-apk
          path: apk

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -la /dev/kvm || true

      - name: Boot emulator and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb wait-for-device
            adb shell settings put global window_animation_scale 0 || true
            adb shell settings put global transition_animation_scale 0 || true
            adb shell settings put global animator_duration_scale 0 || true

            echo "=== install ==="
            adb install -r -t apk/mcbox-x86_64.apk || exit 2

            adb shell appops set com.mcbox.launcher MANAGE_EXTERNAL_STORAGE allow || true
            adb shell pm grant com.mcbox.launcher android.permission.READ_EXTERNAL_STORAGE || true
            adb shell pm grant com.mcbox.launcher android.permission.WRITE_EXTERNAL_STORAGE || true

            adb logcat -c || true
            echo "=== start ==="
            adb shell am start -W -n com.mcbox.launcher/.ui.MainActivity || exit 3
            sleep 25

            echo "=== pid ==="
            PID=$(adb shell pidof com.mcbox.launcher | tr -d '\r')
            echo "pid=$PID"

            echo "=== focus ==="
            FOCUS=$(adb shell dumpsys window 2>/dev/null | grep -i mCurrentFocus | head -3)
            echo "$FOCUS"

            echo "=== crash buffer ==="
            adb logcat -d -b crash | tail -80 || true

            echo "=== ui dump ==="
            adb shell uiautomator dump /sdcard/ui.xml || true
            adb pull /sdcard/ui.xml ui.xml || true
            echo "--- texts ---"
            grep -o 'text="[^"]\+"' ui.xml | head -40 || true
            echo "--- packages ---"
            grep -o 'package="[^"]\+"' ui.xml | sort -u | head -10 || true

            echo "=== activity ==="
            adb shell dumpsys activity activities 2>/dev/null | grep -i mcbox | head -10 || true

            echo "=== verdict ==="
            if [ -z "$PID" ]; then
              echo "RESULT=FAIL_NO_PROCESS"
              exit 11
            fi
            if adb logcat -d -b crash | grep -q "com.mcbox.launcher"; then
              echo "RESULT=FAIL_CRASH"
              exit 12
            fi
            if echo "$FOCUS" | grep -q "com.mcbox.launcher"; then
              echo "RESULT=PASS_FOREGROUND"
              exit 0
            fi
            if grep -q 'com.mcbox.launcher' ui.xml; then
              echo "RESULT=PASS_UI"
              exit 0
            fi
            echo "RESULT=FAIL_NOT_FOREGROUND"
            exit 13

      - name: Collect device logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-logs
          path: ui.xml
          retention-days: 14
          if-no-files-found: ignore