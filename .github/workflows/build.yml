name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true

      - name: Fetch native libraries
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L --retry 3 --retry-delay 2 \
            -o pojav.apk \
            https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk
          ls -la pojav.apk
          mkdir -p extract
          unzip -o -q pojav.apk 'lib/arm64-v8a/*' -d extract
          cp extract/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          ls app/src/main/jniLibs/arm64-v8a

      - name: Fetch LWJGL components
        run: |
          set -e
          mkdir -p app/src/main/assets/components
          unzip -o -q pojav.apk 'assets/components/*' -d extract
          cp -r extract/assets/components/lwjgl3 app/src/main/assets/components/
          cp -r extract/assets/components/caciocavallo17 app/src/main/assets/components/
          cp -r extract/assets/components/security app/src/main/assets/components/
          find app/src/main/assets/components -maxdepth 2 -type f | head -20

      - name: Fetch Java runtimes
        run: |
          set -e
          mkdir -p app/src/main/assets/runtime/jre21 app/src/main/assets/runtime/jre8
          cp extract/assets/components/jre-21/universal.tar.xz app/src/main/assets/runtime/jre21/
          cp extract/assets/components/jre-21/bin-arm64.tar.xz app/src/main/assets/runtime/jre21/
          cp extract/assets/components/jre/universal.tar.xz app/src/main/assets/runtime/jre8/
          cp extract/assets/components/jre/bin-arm64.tar.xz app/src/main/assets/runtime/jre8/
          du -sh app/src/main/assets/runtime/*

      - name: Compile core module
        run: gradle :core:compileKotlin --stacktrace --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mcbox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/**
            core/build/reports/**
          retention-days: 7
          if-no-files-found: ignore