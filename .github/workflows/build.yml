name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cache payload
        id: cache
        uses: actions/cache@v4
        with:
          path: payload
          key: pojav-payload-gladiolus-v2

      - name: Fetch payload
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p payload
          curl -L --retry 3 --retry-delay 3 -o payload/pojav.apk \
            https://github.com/PojavLauncherTeam/PojavLauncher/releases/download/gladiolus/PojavLauncher.apk
          ls -la payload/pojav.apk

      - name: Upload payload
        uses: actions/upload-artifact@v4
        with:
          name: pojav-payload
          path: payload/pojav.apk
          retention-days: 1

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download payload
        uses: actions/download-artifact@v4
        with:
          name: pojav-payload
          path: payload

      - name: Prepare arm64 assets
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/components
          mkdir -p app/src/main/assets/runtime/jre21 app/src/main/assets/runtime/jre8
          unzip -o -q payload/pojav.apk 'lib/arm64-v8a/*' -d payload/extract
          cp payload/extract/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          unzip -o -q payload/pojav.apk 'assets/components/*' -d payload/extract
          cp -r payload/extract/assets/components/lwjgl3 app/src/main/assets/components/
          cp -r payload/extract/assets/components/caciocavallo17 app/src/main/assets/components/
          cp -r payload/extract/assets/components/security app/src/main/assets/components/
          cp payload/extract/assets/components/jre-21/universal.tar.xz app/src/main/assets/runtime/jre21/
          cp payload/extract/assets/components/jre-21/bin-arm64.tar.xz app/src/main/assets/runtime/jre21/
          cp payload/extract/assets/components/jre/universal.tar.xz app/src/main/assets/runtime/jre8/
          cp payload/extract/assets/components/jre/bin-arm64.tar.xz app/src/main/assets/runtime/jre8/
          du -sh app/src/main/assets/runtime/*

          # Android 禁止从 app 私有数据目录（app_data_file）执行文件，
          # 只有 nativeLibraryDir（apk_data_file）允许 exec。
          # 因此把 JRE 的 java 启动器以 .so 名字打包进 jniLibs，
          # 安装后 app 可以直接 ProcessBuilder 执行 $nativeLibraryDir/libjavaexec.so。
          mkdir -p tmpjre
          # 压缩包内路径带 ./ 前缀（形如 ./bin/java），必须匹配
          tar -xJf app/src/main/assets/runtime/jre21/bin-arm64.tar.xz -C tmpjre ./bin/java
          if [ -f tmpjre/bin/java ]; then
            cp tmpjre/bin/java app/src/main/jniLibs/arm64-v8a/libjavaexec.so
            chmod +x app/src/main/jniLibs/arm64-v8a/libjavaexec.so
            file app/src/main/jniLibs/arm64-v8a/libjavaexec.so

            # libjavaexec.so 的 DT_NEEDED 里有 libjli.so。dlopen 时 linker 在
            # classloader-namespace 里按 SONAME 查找，JRE 目录不在该 namespace 中，
            # 因此把 libjli.so 一并放进 nativeLibraryDir，与 libjavaexec.so 同目录即可解析。
            tar -xJf app/src/main/assets/runtime/jre21/universal.tar.xz -C tmpjre ./lib/libjli.so 2>/dev/null               || tar -xJf app/src/main/assets/runtime/jre21/bin-arm64.tar.xz -C tmpjre ./lib/libjli.so 2>/dev/null               || true
            # libjli.so 自身 DT_NEEDED 含 libz.so，Android JRE 不带它，
            # 从系统库复制一份同目录，保证 dlopen 的依赖链闭合。
            for syslib in /system/lib64/libz.so /apex/com.android.runtime/lib64/bionic/libz.so; do
              if [ -f "$syslib" ]; then
                cp "$syslib" app/src/main/jniLibs/arm64-v8a/libz.so
                echo "LIBZ_PACKED from $syslib"
                break
              fi
            done
            # JRE 的 so 互相依赖（libnio -> libnet 等），JVM 只在
            # classloader-namespace 里解析，JRE 目录不在该 namespace，
            # 因此把运行期必需的核心 so 一并打进 nativeLibraryDir。
            for lib in libnet.so libnio.so libzip.so libjava.so libverify.so libjimage.so libjsig.so; do
              tar -xJf app/src/main/assets/runtime/jre21/bin-arm64.tar.xz -C tmpjre ./lib/$lib 2>/dev/null || true
              if [ -f tmpjre/lib/$lib ]; then
                cp tmpjre/lib/$lib app/src/main/jniLibs/arm64-v8a/$lib
                echo "PACKED $lib"
              fi
            done
            if [ -f tmpjre/lib/libjli.so ]; then
              cp tmpjre/lib/libjli.so app/src/main/jniLibs/arm64-v8a/libjli.so
              echo "LIBJLI_PACKED"
            else
              echo "ERROR: 未能提取 libjli.so"
              tar -tJf app/src/main/assets/runtime/jre21/universal.tar.xz | grep -i 'libjli' | head
              exit 1
            fi
            echo "JAVA_EXEC_PACKED"
          else
            echo "ERROR: 未能从 bin-arm64.tar.xz 提取 ./bin/java"
            tar -tJf app/src/main/assets/runtime/jre21/bin-arm64.tar.xz | grep -i 'bin/java' | head
            exit 1
          fi

      - name: Build arm64 APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stash arm64 apk
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/yin-arm64.apk
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yin-apk
          path: out/*.apk
          retention-days: 10
          if-no-files-found: error

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
